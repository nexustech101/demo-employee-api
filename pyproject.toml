[project]
name = "employee-api-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nexustech101", email = "charlesldefreeseiii@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.4",
